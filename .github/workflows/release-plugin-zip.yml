name: Release plugin ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build and attach plugin ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set release version and validate plugin files
        shell: bash
        run: |
          set -euo pipefail

          version="$RELEASE_TAG"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $version must be a bare semantic version such as 1.0.1"
            exit 1
          fi

          update_version() {
            local file="$1"
            local filter="$2"
            local temporary="${file}.tmp"
            jq --arg version "$version" "$filter" "$file" > "$temporary"
            mv "$temporary" "$file"
          }

          update_version plugin.json '.version = $version'
          update_version .claude-plugin/plugin.json '.version = $version'
          update_version .claude-plugin/marketplace.json \
            '.metadata.version = $version | .plugins[0].version = $version'
          update_version .codex-plugin/plugin.json '.version = $version'
          update_version .cursor-plugin/plugin.json '.version = $version'
          update_version gemini-extension.json '.version = $version'
          update_version mcp-manifest.json '.version = $version'
          update_version server.json '.version = $version'

          # Backfill releases tagged before the portable MCP manifest was added.
          if [[ ! -f mcp.json ]]; then
            jq '{
              "$schema": "https://agent-plugins.org/schemas/1.0.0/mcp.schema.json",
              "mcpServers": {
                "picsio": {
                  "type": "streamable-http",
                  "url": .mcpServers.picsio.url,
                  "extensions": {
                    "com.openai": {
                      "auth": {
                        "type": "oauth",
                        "client": {"mode": "dcr"},
                        "registrationUrl": "https://mcp.pics.io/oauth/register",
                        "baseScopes": [
                          "assets_read",
                          "collections_read",
                          "keywords_read",
                          "customFields_read"
                        ]
                      }
                    }
                  }
                }
              }
            }' .mcp.json > mcp.json
          fi

          node scripts/validate.mjs

          if jq -e '
            .. | objects | to_entries[]? |
            select(
              .key | ascii_downcase |
              test("^(client_?id|client_?secret|access_?token|authorization|headers)$")
            )
          ' .mcp.json mcp.json >/dev/null; then
            echo "::error::MCP configuration must not contain client credentials, tokens, authorization headers, or static headers"
            exit 1
          fi

      - name: Build and verify ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r '.version' plugin.json)"
          zip_name="picsio-codex-plugin-${version}.zip"
          zip_path="dist/${zip_name}"

          mkdir -p dist
          git add -- \
            plugin.json \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json \
            .cursor-plugin/plugin.json \
            gemini-extension.json \
            mcp.json \
            mcp-manifest.json \
            server.json
          release_tree="$(git write-tree)"
          git archive --format=zip --output="$zip_path" "$release_tree"
          unzip -t "$zip_path"

          entries="$(unzip -Z1 "$zip_path")"
          for required in \
            plugin.json \
            .mcp.json \
            mcp.json \
            .codex-plugin/plugin.json \
            assets/logo.png \
            skills/picsio-asset-search/SKILL.md \
            skills/picsio-help-docs/SKILL.md; do
            if ! grep -Fxq "$required" <<<"$entries"; then
              echo "::error::Release ZIP is missing $required at the archive root"
              exit 1
            fi
          done

          if grep -Eq '(^|/)(\.git|\.DS_Store)(/|$)|(^|/)\.claude/settings\.local\.json$|\.zip$' <<<"$entries"; then
            echo "::error::Release ZIP contains a local-only or nested ZIP file"
            exit 1
          fi

          for mcp_config in .mcp.json mcp.json; do
            if unzip -p "$zip_path" "$mcp_config" | jq -e '
              .. | objects | to_entries[]? |
              select(
                .key | ascii_downcase |
                test("^(client_?id|client_?secret|access_?token|authorization|headers)$")
              )
            ' >/dev/null; then
              echo "::error::Packaged $mcp_config contains forbidden credential configuration"
              exit 1
            fi
          done

          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Attach ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "$RELEASE_TAG" \
            "${{ steps.package.outputs.zip_path }}" \
            --clobber
